<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/podclick-design.css?v=20261004-1">
  <meta charset="UTF-8" />
  <link rel="icon" href="/static/podclick-mark.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Crew · PodClickAI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body { font-family: var(--font-body); background: var(--bg); color: var(--text-pri); min-height: 100vh; overflow-x: hidden; }
    button { font-family: inherit; color: inherit; cursor: pointer; }
    a { color: var(--orange-hi); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .hidden { display: none !important; }

    .content-area { max-width: 1400px; width: 100%; margin: 0 auto; padding: 28px 24px; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .page-head h1 { font-family: var(--font-display); font-size: 34px; font-weight: 700; letter-spacing: .02em; }
    .page-head .sub { color: var(--text-sec); font-size: 14px; margin-top: 4px; }
    .badges { display: flex; gap: 10px; flex-wrap: wrap; }
    .badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--border-lit); border-radius: var(--radius);
      background: var(--bg-card); text-decoration: none; color: var(--text-pri); font-family: var(--font-cond); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
    .badge:hover { border-color: var(--border-hot); background: var(--orange-mist); }
    .badge .k { color: var(--text-dim); }

    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; align-items: start; }
    .layout > * { min-width: 0; }

    /* Category grid */
    .cat { margin-bottom: 26px; }
    .cat-head { display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; margin-bottom: 12px; border-bottom: 1px solid var(--border);
      font-family: var(--font-cond); text-transform: uppercase; letter-spacing: .08em; color: var(--text-sec); font-size: 15px; font-weight: 600; }
    .cat-head .n { color: var(--text-dim); }
    .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    .chip { position: relative; text-align: left; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px 34px 12px 14px; min-width: 0; display: block; width: 100%; }
    .chip:hover { border-color: var(--border-hot); background: var(--orange-mist); }
    .chip:focus-visible, .btn:focus-visible, .pill:focus-visible, .row:focus-visible, .drawer-x:focus-visible, .pick:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
    .chip .nm { font-family: var(--font-cond); font-size: 16px; color: var(--text-pri); display: block; font-weight: 600; letter-spacing: .02em; }
    .chip .jb { color: var(--text-sec); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
    .chip .dot { position: absolute; top: 12px; right: 12px; width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
    .chip.s-needs_setup .dot { background: var(--yellow); }
    .chip.s-not_built { opacity: .5; }
    .chip.s-not_built .dot { background: var(--text-dim); }
    .chip.running { border-color: var(--orange); }
    .chip.running .dot { background: var(--orange); animation: crewPulse 1.2s ease-in-out infinite; box-shadow: 0 0 0 3px var(--orange-glow); }
    @keyframes crewPulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }

    .skel { height: 62px; background: var(--bg-raised); border-radius: var(--radius); animation: crewPulse 1.4s ease-in-out infinite; }
    .loading-note { color: var(--text-sec); font-family: var(--font-cond); letter-spacing: .06em; margin-bottom: 12px; }

    .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
    .panel.err { border-color: var(--border-hot); }
    .panel p { color: var(--text-sec); font-size: 14px; margin-bottom: 10px; }

    /* Rail */
    .rail section { margin-bottom: 22px; }
    .rail h2 { font-family: var(--font-cond); text-transform: uppercase; letter-spacing: .08em; font-size: 15px; color: var(--text-sec); font-weight: 600;
      display: flex; align-items: center; gap: 8px; padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--border); }
    .count { background: var(--bg-raised); color: var(--text-sec); border-radius: var(--radius); padding: 1px 8px; font-size: 12px; }
    .count.hot { background: var(--orange); color: var(--text-pri); }
    .rail-toggle { all: unset; display: flex; align-items: center; gap: 8px; width: 100%; cursor: pointer; }
    .row { display: block; width: 100%; text-align: left; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 9px 12px; margin-bottom: 8px; min-width: 0; }
    .row:hover { border-color: var(--border-hot); background: var(--orange-mist); }
    .row .t { display: flex; justify-content: space-between; gap: 8px; font-family: var(--font-cond); font-size: 15px; }
    .row .m { color: var(--text-sec); font-size: 12px; margin-top: 3px; overflow-wrap: anywhere; }
    .row .id { font-family: var(--font-mono); color: var(--text-dim); font-size: 11px; }
    .st { font-family: var(--font-cond); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
    .st-done { color: var(--green-hi); } .st-failed { color: var(--red); } .st-needs_approval { color: var(--orange-hi); }
    .st-running, .st-committing { color: var(--orange); } .st-queued { color: var(--yellow); }
    .st-rejected, .st-cancelled { color: var(--text-sec); }
    .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .pill { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 3px 10px; font-size: 12px; font-family: var(--font-cond); letter-spacing: .04em; }
    .pill[aria-pressed="true"] { border-color: var(--orange); color: var(--orange-hi); background: var(--orange-mist); }
    .empty { color: var(--text-dim); font-size: 13px; padding: 6px 2px; }
    .link-btn { background: none; border: none; color: var(--orange-hi); text-decoration: underline; padding: 0; font-size: 13px; }

    /* Buttons */
    .btn { background: var(--bg-raised); border: 1px solid var(--border-lit); border-radius: var(--radius); padding: 8px 16px; font-family: var(--font-cond);
      font-size: 14px; letter-spacing: .05em; text-transform: uppercase; text-decoration: none; color: var(--text-pri); display: inline-block; }
    .btn:hover:not(:disabled) { border-color: var(--border-hot); }
    .btn.primary { background: var(--orange); border-color: var(--orange); }
    .btn.primary:hover:not(:disabled) { background: var(--orange-hi); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.sm { padding: 3px 10px; font-size: 12px; }

    /* Drawer */
    .scrim { position: fixed; inset: 0; background: var(--bg); opacity: .7; z-index: 1000; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 520px; max-width: 100%; background: var(--bg-panel); border-left: 1px solid var(--border-lit);
      z-index: 1001; display: flex; flex-direction: column; }
    .drawer-head { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
    .drawer-head h2 { font-family: var(--font-display); font-size: 26px; font-weight: 700; overflow-wrap: anywhere; }
    .drawer-head .cat-l { font-family: var(--font-cond); text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); font-size: 12px; }
    .drawer-head .jb { color: var(--text-sec); font-size: 13px; margin-top: 4px; }
    .drawer-x { background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius); width: 32px; height: 32px; font-size: 16px; flex-shrink: 0; }
    .drawer-body { padding: 16px 18px; overflow-y: auto; overflow-x: hidden; flex: 1; min-width: 0; }
    .drawer-foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .drawer h3 { font-family: var(--font-cond); text-transform: uppercase; letter-spacing: .08em; font-size: 13px; color: var(--text-sec); margin: 16px 0 8px; font-weight: 600; }
    .drawer h3:first-child { margin-top: 0; }

    .need { display: flex; gap: 8px; font-size: 13px; padding: 5px 0; align-items: baseline; flex-wrap: wrap; }
    .need .mk { font-family: var(--font-mono); width: 16px; }
    .need.ok .mk { color: var(--green-hi); } .need.bad .mk { color: var(--yellow); }
    .need a { margin-left: auto; font-size: 12px; }
    pre.code, pre.out { font-family: var(--font-mono); font-size: 12px; background: var(--bg-inset); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-pri); }
    .banner { border: 1px solid var(--border-hot); background: var(--orange-mist); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
    .banner.warn { border-color: var(--yellow); background: var(--bg-card); }
    .banner.err { border-color: var(--red); background: var(--bg-card); }

    .field { margin-bottom: 14px; }
    .field label.lb, .field .lb { display: block; font-size: 13px; color: var(--text-sec); margin-bottom: 4px; font-family: var(--font-cond); letter-spacing: .04em; }
    .field .req { color: var(--orange-hi); }
    .field .help { color: var(--text-dim); font-size: 12px; margin-top: 3px; }
    .field .ferr { color: var(--red); font-size: 12px; margin-top: 3px; }
    input[type=text], input[type=number], input[type=date], select, textarea {
      width: 100%; background: var(--bg-inset); border: 1px solid var(--border-lit); border-radius: var(--radius); color: var(--text-pri);
      padding: 8px 10px; font-family: var(--font-body); font-size: 14px; }
    textarea { min-height: 90px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--orange); outline-offset: 0; }
    .field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--red); }
    .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
    .checks label { font-size: 13px; display: flex; gap: 6px; align-items: center; }
    .drop { border: 1px dashed var(--border-hot); border-radius: var(--radius); padding: 14px; text-align: center; color: var(--text-sec); font-size: 13px; background: var(--bg-inset); }
    .drop.over { background: var(--orange-mist); border-color: var(--orange); }
    .upl { display: flex; gap: 8px; align-items: center; font-size: 12px; margin-top: 6px; min-width: 0; }
    .upl .fn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar { height: 4px; background: var(--bg-raised); border-radius: 2px; flex: 0 0 90px; }
    .bar i { display: block; height: 100%; background: var(--orange); border-radius: 2px; width: 0; }
    .picker { display: flex; gap: 8px; flex-wrap: wrap; }
    .pick { border: 2px solid var(--border); background: var(--bg-card); border-radius: var(--radius); padding: 0; width: 64px; height: 64px; overflow: hidden; }
    .pick[aria-pressed="true"] { border-color: var(--orange); }
    .pick img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cost { color: var(--text-sec); font-size: 12px; font-family: var(--font-mono); margin-bottom: 10px; overflow-wrap: anywhere; }
    .wraps { color: var(--text-dim); font-family: var(--font-mono); font-size: 11px; overflow-wrap: anywhere; margin-top: 14px; }

    /* Job */
    .jhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .jhead .lbl { font-family: var(--font-display); font-size: 22px; font-weight: 700; }
    .jhead .mono { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); overflow-wrap: anywhere; }
    .steps { list-style: none; margin-bottom: 8px; }
    .steps li { display: flex; gap: 8px; font-size: 13px; padding: 3px 0; align-items: baseline; }
    .steps .ic { font-family: var(--font-mono); width: 14px; color: var(--text-dim); }
    .steps li.running .ic { color: var(--orange); animation: crewPulse 1.2s ease-in-out infinite; }
    .steps li.completed .ic { color: var(--green-hi); } .steps li.failed .ic, .steps li.failed { color: var(--red); }
    .out { margin-bottom: 16px; min-width: 0; }
    .out .ol { font-family: var(--font-cond); font-size: 14px; letter-spacing: .04em; margin-bottom: 6px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px; font-size: 13px; overflow-wrap: anywhere; }
    .card .ct { font-family: var(--font-cond); font-size: 15px; }
    .card .kv { color: var(--text-sec); margin-top: 3px; }
    .card .kv b { color: var(--text-dim); font-weight: 500; font-family: var(--font-cond); letter-spacing: .04em; }
    .card img { max-width: 100%; border-radius: var(--radius); margin-bottom: 6px; display: block; }
    .tag { display: inline-block; border: 1px solid var(--border-lit); border-radius: var(--radius); padding: 0 7px; font-size: 11px; color: var(--text-sec); margin-right: 6px; font-family: var(--font-cond); }
    .tbl { width: 100%; overflow-x: auto; }
    .tbl table { border-collapse: collapse; font-size: 12px; width: 100%; }
    .tbl th, .tbl td { border-bottom: 1px solid var(--border); padding: 5px 8px; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
    .tbl th { color: var(--text-dim); font-family: var(--font-cond); letter-spacing: .06em; text-transform: uppercase; font-weight: 500; }
    video, audio { width: 100%; max-width: 100%; border-radius: var(--radius); background: var(--bg-inset); }
    .imgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .imgs figure img { width: 100%; border-radius: var(--radius); display: block; }
    .line-note { color: var(--text-sec); font-size: 12px; margin: 6px 0; }
    .toast-wrap { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 1100; display: flex; flex-direction: column; gap: 8px; max-width: calc(100% - 32px); }
    .toast { background: var(--bg-raised); border: 1px solid var(--border-hot); border-radius: var(--radius); padding: 9px 14px; font-size: 13px; }
    .toast.err { border-color: var(--red); } .toast.ok { border-color: var(--green); }

    @media (max-width: 1099px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 759px) {
      .content-area { padding: 18px 16px; }
      .page-head h1 { font-size: 28px; }
      .chips { grid-template-columns: minmax(0, 1fr); }
      .drawer { width: 100%; border-left: none; }
      .imgs { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
  <script src="/static/podclick-nav.js?v=20261004-1" defer></script>
</head>
<body>
<main class="content-area">
  <div class="page-head">
    <div>
      <h1>The Crew</h1>
      <div class="sub">Put a crew member to work. Anything that ships lands on your punch list first.</div>
    </div>
    <div class="badges">
      <a class="badge" href="/permit" id="permit-badge"><span class="k">Permit</span> <span id="permit-tier">&mdash;</span></a>
      <a class="badge" href="/foundation" id="found-badge"><span class="k">Foundation</span> <span id="found-tier">&mdash;</span></a>
    </div>
  </div>

  <div class="layout">
    <div id="crew-main" aria-live="polite"></div>
    <aside class="rail" aria-label="Punch list and work orders">
      <section id="punch-sec">
        <h2><button class="rail-toggle" type="button" data-toggle="punch-body" aria-expanded="true">Punch list <span class="count" id="punch-count">0</span></button></h2>
        <div id="punch-body"></div>
      </section>
      <section id="orders-sec">
        <h2><button class="rail-toggle" type="button" data-toggle="orders-body" aria-expanded="true">Work orders <span class="count" id="orders-count">0</span></button></h2>
        <div id="orders-body">
          <div class="pills" id="order-pills" role="group" aria-label="Filter work orders">
            <button class="pill" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="pill" type="button" data-filter="active" aria-pressed="false">On site</button>
            <button class="pill" type="button" data-filter="built" aria-pressed="false">Built</button>
            <button class="pill" type="button" data-filter="stalled" aria-pressed="false">Stalled</button>
          </div>
          <div id="orders-list"></div>
        </div>
      </section>
    </aside>
  </div>
</main>

<div id="scrim" class="scrim hidden"></div>
<div id="drawer" class="drawer hidden" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
  <div class="drawer-head">
    <div style="min-width:0">
      <div class="cat-l" id="drawer-cat"></div>
      <h2 id="drawer-title"></h2>
      <div class="jb" id="drawer-job"></div>
    </div>
    <button class="drawer-x" id="drawer-x" type="button" aria-label="Close">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot" id="drawer-foot"></div>
</div>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script>
/* ── helpers ─────────────────────────────────────────────────── */
var ENV_NAMES = { youtube_api: 'YOUTUBE_DATA_API_KEY', pexels: 'PEXELS_API_KEY', openai: 'OPENAI_API_KEY',
  anthropic: 'ANTHROPIC_API_KEY', ghl: 'GHL_TOKEN', elevenlabs: 'ELEVENLABS_API_KEY', higgsfield: 'HIGGSFIELD_API_KEY' };
var PROVIDER_NAMES = { youtube_api: 'YouTube data key', pexels: 'Pexels', openai: 'OpenAI', anthropic: 'Anthropic',
  ghl: 'GoHighLevel', elevenlabs: 'ElevenLabs', higgsfield: 'Higgsfield' };
var STATUS_WORDS = { queued: 'Staged', running: 'On site', committing: 'Committing', needs_approval: 'On your punch list',
  done: 'Built', failed: 'Stalled', rejected: 'Sent back', cancelled: 'Stopped' };
var TERMINAL = { done: 1, failed: 1, rejected: 1, cancelled: 1 };

var crew = null;          // last GET /api/agents payload
var agentsById = {};
var recentJobs = [];      // work orders cache
var drawer = { mode: null, agentId: null, jobId: null, opener: null };
var pollTimer = null, pollStart = 0, pollFails = 0, railTimer = null, timerTick = null;
var uploads = {};         // fieldName -> [{upload_id, filename}]
var persona = [];
var orderFilter = 'all';
var currentJob = null;

function escHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function $(id) { return document.getElementById(id); }
function shortId(id) { return String(id || '').slice(0, 8); }
function ago(iso) {
  var t = Date.parse(iso); if (isNaN(t)) return '';
  var s = Math.max(0, Math.round((Date.now() - t) / 1000));
  if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return Math.floor(s / 86400) + 'd ago';
}
function crewToast(msg, kind) {
  var d = document.createElement('div'); d.className = 'toast ' + (kind || '');
  d.textContent = msg; $('toasts').appendChild(d);
  setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 4000);
}
function api(path, opts) {
  opts = opts || {};
  var init = { method: opts.method || 'GET', headers: {} };
  if (opts.body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body); }
  return fetch(path, init).then(function (r) {
    return r.text().then(function (t) {
      var data = null; try { data = t ? JSON.parse(t) : null; } catch (e) { data = null; }
      return { status: r.status, ok: r.ok, data: data };
    });
  }).catch(function () { return { status: 0, ok: false, data: null }; });
}
function agentName(id) { var a = agentsById[id]; return a ? a.name : String(id || '').replace(/_/g, ' '); }
function isRunning(j) { return j && (j.status === 'queued' || j.status === 'running' || j.status === 'committing'); }

/* ── page: loadCrew ─────────────────────────────────────────── */
function renderSkeleton() {
  var h = '<div class="loading-note">Rounding up the crew…</div>';
  for (var c = 0; c < 2; c++) { h += '<div class="cat"><div class="chips">' + '<div class="skel"></div>'.repeat(3) + '</div></div>'; }
  $('crew-main').innerHTML = h;
}
function loadCrew() {
  renderSkeleton();
  return api('/api/agents').then(function (r) {
    if (r.status === 503) {
      $('crew-main').innerHTML = '<div class="panel err"><p>The Crew only runs on your local studio right now.</p></div>'; return;
    }
    if (!r.ok || !r.data || !r.data.categories) {
      $('crew-main').innerHTML = '<div class="panel err"><p>Couldn\'t reach the crew — the server didn\'t answer.</p>' +
        '<button class="btn" type="button" id="crew-retry">Try again</button></div>';
      $('crew-retry').addEventListener('click', loadCrew); return;
    }
    crew = r.data; agentsById = {};
    var html = '';
    crew.categories.forEach(function (cat) {
      (cat.agents || []).forEach(function (a) { agentsById[a.id] = a; });
      html += renderCategory(cat);
    });
    $('crew-main').innerHTML = html || '<div class="panel"><p>No crew members on site yet.</p></div>';
    $('permit-tier').textContent = (crew.permit && crew.permit.current_tier) || '—';
    var f = crew.foundation || {};
    $('found-tier').textContent = f.tier ? (f.tier + (f.sample_count != null ? ' · ' + f.sample_count : '')) : '—';
    markRunning();
  });
}
function renderCategory(cat) {
  var agents = cat.agents || [];
  if (!agents.length) return '';
  return '<div class="cat"><div class="cat-head"><span>' + escHtml(cat.label) + '</span><span class="n">' + agents.length + '</span></div>' +
    '<div class="chips">' + agents.map(renderChip).join('') + '</div></div>';
}
function renderChip(a) {
  var st = a.state || 'ready';

    if (drawer.jobId !== jobId) return;
    if (r.ok && r.data) { pollFails = 0; currentJob = r.data; renderJob(r.data); if (!TERMINAL[r.data.status] && r.data.status !== 'needs_approval') startPoll(jobId); else stopPoll(); return; }
    if (r.status === 404) { $('drawer-body').innerHTML = '<div class="banner err">That work order isn\'t on file.</div>'; return; }
    pollFails++;

  });
}
function startPoll(jobId) {
  stopPoll(); if (!pollStart) pollStart = Date.now();
  var delay = (Date.now() - pollStart) < 60000 ? 2000 : 5000;
  pollTimer = setTimeout(function () { pollJob(jobId); }, delay);
}
function pollJob(jobId) {
  if (drawer.jobId !== jobId) return;
  fetchJob(jobId, false).then(function () { if (drawer.jobId === jobId && pollFails > 0 && pollFails < 3) startPoll(jobId); });
}
function stopPoll() { clearTimeout(pollTimer); pollTimer = null; }
function renderSteps(steps) {
  var ic = { pending: '○', running: '●', completed: '✓', failed: '✗', skipped: '–' };
  return '<ul class="steps">' + (steps || []).map(function (s) {
    return '<li class="' + escHtml(s.status) + '"><span class="ic" aria-hidden="true">' + (ic[s.status] || '○') + '</span><span>' + escHtml(s.label || s.key) +
      '<span class="sr-only"> (' + escHtml(s.status) + ')</span>' + (s.error ? ' — ' + escHtml(s.error) : '') + '</span></li>'; }).join('') + '</ul>';
}
function mediaUrl(o, job) { return o.url || (o.file ? '/api/agents/jobs/' + encodeURIComponent(job.id) + '/files/' + encodeURIComponent(o.file) : ''); }
function cardHtml(c, schema) {
  if (c == null || typeof c !== 'object') return '<div class="card">' + escHtml(c) + '</div>';
  var title = c.title || c.name || c.label || c.topic || '', skip = { title: 1, name: 1, label: 1, thumbnail: 1, thumb: 1, url: 1, video_url: 1, clip_url: 1, pillar: 1, score: 1, popular: 1 };
  var h = '<div class="card">';
  var th = c.thumbnail || c.thumb; if (th && /^(https?:)?\/\//.test(th) || (th && th.charAt(0) === '/')) h += '<img src="' + escHtml(th) + '" alt="" loading="lazy">';
  var vu = c.video_url || c.clip_url; if (vu && (vu.charAt(0) === '/' || /^https?:/.test(vu))) h += '<video controls playsinline preload="metadata" src="' + escHtml(vu) + '"></video>';
  if (c.pillar) h += '<span class="tag">' + escHtml(c.pillar) + '</span>';
  if (c.score != null) h += '<span class="tag">Score ' + escHtml(c.score) + '</span>';
  if (c.popular) h += '<span class="tag">Popular</span>';
  if (title) h += '<div class="ct">' + escHtml(title) + '</div>';
  Object.keys(c).forEach(function (k) {
    if (skip[k] || k === 'title' || c[k] == null || c[k] === '') return;
    var v = typeof c[k] === 'object' ? JSON.stringify(c[k]) : c[k];
    h += '<div class="kv"><b>' + escHtml(k.replace(/_/g, ' ')) + ':</b> ' + escHtml(v) + '</div>';
  });
  return h + '</div>';
}
function renderOutput(o, job, editable) {
  var h = '<div class="out" data-out="' + escHtml(o.id) + '"><div class="ol"><span>' + escHtml(o.label || o.kind) + '</span>';
  var v = o.value, url = mediaUrl(o, job);
  if (o.kind === 'text') {
    var txt = typeof v === 'string' ? v : JSON.stringify(v, null, 2);
    h += '<button class="btn sm" type="button" data-copy-out="' + escHtml(o.id) + '">Copy</button></div>';
    h += editable ? '<textarea data-edit="' + escHtml(o.id) + '" data-edit-kind="text" style="min-height:160px">' + escHtml(txt) + '</textarea>' : '<pre class="out">' + escHtml(txt) + '</pre>';
  } else if (o.kind === 'cards') {
    h += '</div>' + (Array.isArray(v) ? v.map(function (c) { return cardHtml(c, o.schema); }).join('') : cardHtml(v, o.schema));
    if (editable) h += '<details><summary class="line-note">Edit before approving (JSON)</summary><textarea data-edit="' + escHtml(o.id) + '" data-edit-kind="cards" style="min-height:140px;font-family:var(--font-mono)">' + escHtml(JSON.stringify(v, null, 2)) + '</textarea><div class="ferr" data-edit-err="' + escHtml(o.id) + '"></div></details>';
  } else if (o.kind === 'table') {
    var rows = Array.isArray(v) ? v : [], cols = []; rows.forEach(function (r) { Object.keys(r || {}).forEach(function (k) { if (cols.indexOf(k) < 0) cols.push(k); }); });
    h += '</div><div class="tbl"><table><thead><tr>' + cols.map(function (c) { return '<th>' + escHtml(c.replace(/_/g, ' ')) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r) { return '<tr>' + cols.map(function (c) { var x = r[c]; return '<td>' + escHtml(Array.isArray(x) ? x.join(', ') : (x != null && typeof x === 'object' ? JSON.stringify(x) : x)) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  } else if (o.kind === 'audio') {
    h += '</div><audio controls preload="metadata" src="' + escHtml(url) + '"></audio>';
  } else if (o.kind === 'video') {
    h += '<a class="btn sm" href="' + escHtml(url) + '" download>Download</a></div><video controls playsinline preload="metadata" src="' + escHtml(url) + '"></video>';
  } else if (o.kind === 'images') {
    var list = Array.isArray(v) ? v : (o.files || []);
    h += '</div><div class="imgs">' + list.map(function (it) {
      var u = typeof it === 'string' ? (it.charAt(0) === '/' || /^https?:/.test(it) ? it : '/api/agents/jobs/' + encodeURIComponent(job.id) + '/files/' + encodeURIComponent(it)) : (it.url || '');
      return '<figure><img src="' + escHtml(u) + '" alt="" loading="lazy"><a class="btn sm" href="' + escHtml(u) + '" download>Download</a></figure>'; }).join('') + '</div>';
    if (!list.length && url) h += '<img src="' + escHtml(url) + '" alt="" style="max-width:100%">';
  } else if (o.kind === 'link') {
    h += '</div><a class="btn" href="' + escHtml(url) + '">' + escHtml(o.label || 'Open') + '</a>';
  } else if (o.kind === 'file') {
    h += '</div>' + (url ? '<a class="btn" href="' + escHtml(url) + '" download>Download</a>' : '<div class="card">' + escHtml(typeof v === 'object' ? JSON.stringify(v) : v) + '</div>');
  } else {
    h += '</div><pre class="out">' + escHtml(typeof v === 'string' ? v : JSON.stringify(v, null, 2)) + '</pre>';
  }
  return h + '</div>';
}
var HANDOFFS = { trend_radar: ['content_scheduler', 'Send to Content Scheduler'], market_scout: ['trend_radar', 'Send to Trend Radar'] };
function renderJob(job) {
  var a = agentsById[job.agent_id];
  setHead('Work order', a ? a.name : agentName(job.agent_id), a ? a.job : '');
  var st = job.status, word = STATUS_WORDS[st] || st;
  var h = '<div class="jhead"><span class="lbl st-' + escHtml(st) + '">' + escHtml(word) + '</span><span class="mono">' + escHtml(shortId(job.id)) + ' · <span id="elapsed"></span></span></div>';
  if (st === 'queued') h += '<div class="line-note">Staged — waiting for a free crew slot.</div>';
  if (st === 'committing') h += '<div class="line-note">Committing…</div>';
  if ((job.warnings || []).length) h += job.warnings.map(function (w) { return '<div class="banner warn">' + escHtml(w) + '</div>'; }).join('');
  if (st === 'failed') h += '<div class="banner err">' + escHtml(job.error || 'This one stalled. Run it again.') + '</div>';
  h += '<h3>Steps</h3>' + renderSteps(job.steps) + '<div class="line-note" id="poll-note"></div>';
  var editable = st === 'needs_approval';
  if ((job.outputs || []).length) { h += '<h3>Outputs</h3>' + job.outputs.map(function (o) { return renderOutput(o, job, editable && (o.kind === 'text' || o.kind === 'cards')); }).join(''); }
  if (st === 'needs_approval' && job.approval) h += '<div class="banner">On your punch list: ' + escHtml(job.approval.summary || '') + '</div>';
  if (st === 'done' && job.commit_result) {
    var cr = job.commit_result, msg = typeof cr === 'string' ? cr : (cr.summary || cr.message || ''), href = cr.url || cr.link || '';
    h += '<div class="banner">' + escHtml(msg || 'Committed.') + (href ? ' <a href="' + escHtml(href) + '">Open</a>' : '') + '</div>';
  }
  $('drawer-body').innerHTML = h;
  var f = '';
  if (st === 'queued' || st === 'running') f = '<button class="btn" type="button" data-act="cancel">Stop</button>';
  else if (st === 'needs_approval') f = '<button class="btn primary" type="button" data-act="approve">Approve &amp; commit</button><button class="btn" type="button" data-act="reject">Reject</button>';
  else if (st === 'committing') f = '<button class="btn primary" type="button" disabled>Committing…</button>';
  else if (st === 'done' || st === 'failed' || st === 'rejected' || st === 'cancelled') {
    f = '<button class="btn" type="button" data-act="again">Run again</button>';
    if (st === 'done' && HANDOFFS[job.agent_id] && agentsById[HANDOFFS[job.agent_id][0]]) f += '<button class="btn primary" type="button" data-act="handoff" data-to="' + escHtml(HANDOFFS[job.agent_id][0]) + '">' + escHtml(HANDOFFS[job.agent_id][1]) + '</button>';
  }
  f += '<button class="btn" type="button" data-act="close">Close</button>';
  $('drawer-foot').innerHTML = f;
  clearInterval(timerTick);
  var t0 = Date.parse(job.created_at), t1 = TERMINAL[st] ? Date.parse(job.updated_at) : null;
  function tick() { var e = $('elapsed'); if (!e || isNaN(t0)) return; var s = Math.max(0, Math.round(((t1 || Date.now()) - t0) / 1000)); e.textContent = Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  tick(); if (!t1) timerTick = setInterval(tick, 1000);
}
function collectEdits() {
  var edits = {}, bad = false;
  document.querySelectorAll('[data-edit]').forEach(function (el) {
    var id = el.getAttribute('data-edit'), kind = el.getAttribute('data-edit-kind');
    var orig = (currentJob.outputs || []).filter(function (o) { return o.id === id; })[0]; if (!orig) return;
    if (kind === 'text') { if (el.value !== orig.value) edits[id] = el.value; }
    else { try { var parsed = JSON.parse(el.value); if (JSON.stringify(parsed) !== JSON.stringify(orig.value)) edits[id] = parsed; var e = document.querySelector('[data-edit-err="' + id + '"]'); if (e) e.textContent = ''; }
      catch (err) { bad = true; var e2 = document.querySelector('[data-edit-err="' + id + '"]'); if (e2) e2.textContent = 'That isn\'t valid JSON.'; } }
  });
  return bad ? null : edits;
}
function mutate(jobId, action, body, okMsg) {
  var btns = $('drawer-foot').querySelectorAll('button'); btns.forEach(function (b) { b.disabled = true; });
  return api('/api/agents/jobs/' + encodeURIComponent(jobId) + '/' + action, { method: 'POST', body: body || {} }).then(function (r) {
    if (r.ok && r.data && r.data.job) { currentJob = r.data.job; if (drawer.jobId === jobId) renderJob(r.data.job); crewToast(okMsg, 'ok'); if (!TERMINAL[r.data.job.status] && r.data.job.status !== 'needs_approval') startPoll(jobId); refreshRail(); }
    else { crewToast((r.data && r.data.error) || (r.status === 0 ? 'Couldn\'t reach the crew.' : 'That didn\'t go through.'), 'err'); if (currentJob && drawer.jobId === jobId) renderJob(currentJob); }
  });
}
function approveJob(jobId) {
  var edits = collectEdits(); if (edits === null) return;
  var sum = currentJob && currentJob.approval ? currentJob.approval.summary : 'Commit this work?';
  if (!window.confirm(sum + '\n\nApprove & commit?')) return;
  mutate(jobId, 'approve', Object.keys(edits).length ? { edits: edits } : {}, 'Approved. On the job.');
}
function rejectJob(jobId) { if (window.confirm('Send this one back?')) mutate(jobId, 'reject', {}, 'Sent back.'); }
function cancelJob(jobId) { mutate(jobId, 'cancel', {}, 'Stopped.'); }
function handOff(fromJob, toAgentId) {
  var a = agentsById[toAgentId]; if (!a) return;
  var pre = {}; (a.fields || []).forEach(function (f) { if (f.type === 'job_ref' && (f.job_ref_agents || []).indexOf(fromJob.agent_id) >= 0) pre[f.name] = fromJob.id; });
  openAgentDrawer(toAgentId, pre, drawer.opener);
}

/* ── events ─────────────────────────────────────────────────── */
document.addEventListener('click', function (e) {
  var t = e.target;
  var chip = t.closest('.chip[data-agent-id]'); if (chip) { openAgentDrawer(chip.getAttribute('data-agent-id'), null, chip); return; }
  var row = t.closest('.row[data-job-id]'); if (row) { openJobDrawer(row.getAttribute('data-job-id'), row); return; }
  var tog = t.closest('[data-toggle]'); if (tog) { var b = $(tog.getAttribute('data-toggle')); var hide = !b.classList.contains('hidden'); b.classList.toggle('hidden', hide); tog.setAttribute('aria-expanded', hide ? 'false' : 'true'); return; }
  var pill = t.closest('.pill[data-filter]'); if (pill) { loadWorkOrders(pill.getAttribute('data-filter')); return; }
  var rt = t.closest('[data-retry]'); if (rt) { if (rt.getAttribute('data-retry') === 'punch') loadPunchList(); else loadWorkOrders(); return; }
  if (t.closest('#drawer-x') || t.id === 'scrim') { closeDrawer(); return; }
  var pk = t.closest('[data-persona]'); if (pk) { var sib = pk.parentNode.querySelectorAll('[data-persona]'); for (var i = 0; i < sib.length; i++) sib[i].setAttribute('aria-pressed', sib[i] === pk && pk.getAttribute('aria-pressed') !== 'true' ? 'true' : 'false'); return; }
  var fp = t.closest('[data-pick]'); if (fp) { var inp = document.querySelector('[data-fileinput="' + fp.getAttribute('data-pick') + '"]'); if (inp) inp.click(); return; }
  var cp = t.closest('[data-copy-out]'); if (cp && currentJob) {
    var o = (currentJob.outputs || []).filter(function (x) { return x.id === cp.getAttribute('data-copy-out'); })[0]; if (!o) return;
    var ta = document.querySelector('[data-edit="' + o.id + '"]');
    var txt = ta ? ta.value : (typeof o.value === 'string' ? o.value : JSON.stringify(o.value, null, 2));
    cp.dataset.text = txt;
    (navigator.clipboard ? navigator.clipboard.writeText(cp.dataset.text) : Promise.reject()).then(function () { crewToast('Copied.', 'ok'); }, function () { crewToast('Couldn\'t copy — select the text and copy by hand.', 'err'); });
    return;
  }
  var act = t.closest('[data-act]'); if (!act) return;
  var k = act.getAttribute('data-act');
  if (k === 'close') closeDrawer();
  else if (k === 'run') submitRun(drawer.agentId);
  else if (k === 'approve') approveJob(drawer.jobId);
  else if (k === 'reject') rejectJob(drawer.jobId);
  else if (k === 'cancel') cancelJob(drawer.jobId);
  else if (k === 'again' && currentJob) openAgentDrawer(currentJob.agent_id, currentJob.input || {}, drawer.opener);
  else if (k === 'handoff' && currentJob) handOff(currentJob, act.getAttribute('data-to'));
  else if (k === 'reconnect') { pollFails = 0; pollStart = Date.now(); fetchJob(drawer.jobId, true); }
});
document.addEventListener('change', function (e) {
  var fi = e.target.getAttribute && e.target.getAttribute('data-fileinput');
  if (fi) { uploadAgentFiles(fi, e.target.files); e.target.value = ''; }
});
document.addEventListener('dragover', function (e) { var d = e.target.closest && e.target.closest('.drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', function (e) { var d = e.target.closest && e.target.closest('.drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', function (e) {
  var d = e.target.closest && e.target.closest('.drop'); if (!d) return;
  e.preventDefault(); d.classList.remove('over'); uploadAgentFiles(d.getAttribute('data-field'), e.dataTransfer.files);
});
document.addEventListener('keydown', function (e) {
  if ($('drawer').classList.contains('hidden')) return;
  if (e.key === 'Escape') { closeDrawer(); return; }
  if (e.key === 'Tab') {
    var f = focusables(); if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
document.addEventListener('visibilitychange', function () { if (!document.hidden) { refreshRail(); } else clearTimeout(railTimer); });

document.addEventListener('DOMContentLoaded', function () {
  loadCrew().then(function () { loadPunchList(); loadWorkOrders(); });
});
</script>
